<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>The $20 Auction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A family bidding party game: everyone starts with $20, wins items at auction, and builds a dream creation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout: a comic page. Yellow halftone ground, white panels with ink borders and gutters,
   a black "host desk" panel for the controls, money on cash-green tags. */
:root {
  --ink: #14110F;
  --ink-soft: #3B3530;
  --paper: #FFFFFF;
  --ground: #FFE14D;
  --ground-dot: #F2A900;
  --cyan: #00AEEF;
  --magenta: #EC008C;
  --red: #E4002B;
  --cash: #00A651;
  --cash-dark: #007A3C;
  --caption: #FFE94D;
  --warn: #FF8200;
  --muted: #5B534C;
  --desk: #191513;
  --desk-line: #3A332E;
  --desk-text: #FFF8E7;
  --desk-muted: #CBBFAE;
  --display: 'Bangers', 'Luckiest Guy', 'Trebuchet MS', sans-serif;
  --body: 'Comic Neue', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --border: 3px solid var(--ink);
  --gutter: 14px;
  --radius: 4px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--ground);
  background-image: radial-gradient(var(--ground-dot) 22%, transparent 24%);
  background-size: 11px 11px;
  color: var(--ink);
  font-family: var(--body);
  font-weight: 700;
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--magenta); color: var(--paper); }
* { scrollbar-color: var(--ink) transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 4px solid var(--cyan); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; letter-spacing: 0.02em; margin: 0; text-wrap: balance; line-height: 1; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 1360px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}

/* ---------- panels, captions, buttons ---------- */
.panel { background: var(--paper); border: var(--border); border-radius: var(--radius); position: relative; min-width: 0; }
.caption-box {
  display: inline-block; background: var(--caption); border: var(--border); padding: 4px 12px;
  font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.05em; line-height: 1.1;
}
.btn {
  --b: var(--paper); --f: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 8px 18px;
  background: var(--b); color: var(--f);
  border: var(--border); border-bottom-width: 6px; border-radius: 10px;
  font-family: var(--display); font-size: 1.3rem; letter-spacing: 0.06em; line-height: 1;
  transition: transform .12s cubic-bezier(.2,.8,.2,1), border-bottom-width .12s, background-color .15s;
  text-decoration: none;
}
.btn:hover:not(:disabled) { transform: translateY(-2px) rotate(-1deg); }
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.btn:disabled { opacity: .45; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn-red { --b: var(--red); --f: var(--paper); }
.btn-cash { --b: var(--cash); --f: var(--paper); }
.btn-cyan { --b: var(--cyan); --f: var(--ink); }
.btn-yellow { --b: var(--caption); }
.btn-ink { --b: var(--ink); --f: var(--caption); border-color: var(--caption); }
.btn-big { min-height: 64px; font-size: 1.8rem; padding: 10px 26px; }
.btn-small { min-height: 40px; font-size: 1.05rem; padding: 6px 12px; border-bottom-width: 4px; border-radius: 8px; }
.btn-ghost { --b: transparent; border-color: currentColor; }
.icon-btn { min-width: 48px; padding: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: var(--gutter); }
.topbar .logo { font-family: var(--display); font-size: 1.6rem; letter-spacing: .04em; background: var(--ink); color: var(--caption); padding: 6px 12px; border-radius: 6px; transform: rotate(-2deg); border: 0; }
.topbar .spacer { flex: 1; }
.topbar .round-tag { font-family: var(--display); font-size: 1.35rem; letter-spacing: .05em; }

/* ---------- home: splash ---------- */
.splash { display: grid; gap: var(--gutter); grid-template-columns: 1fr; margin-bottom: 28px; }
.splash-title { padding: 22px 20px 20px; overflow: hidden; background: var(--red); color: var(--paper); }
.splash-title::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.18) 24%, transparent 26%); background-size: 14px 14px; pointer-events: none;
}
.splash-title .kicker-price { position: relative; display: inline-block; background: var(--caption); color: var(--ink); border: var(--border); font-family: var(--display); font-size: 1.1rem; padding: 2px 10px; transform: rotate(-3deg); letter-spacing: .06em; }
.splash-title h1 {
  position: relative; font-size: clamp(3.2rem, 11vw, 6rem); line-height: .88; margin: 10px 0 6px;
  color: var(--caption); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
  transform: rotate(-2deg); transform-origin: left center;
}
.splash-title .sub { position: relative; font-family: var(--display); font-size: clamp(1.6rem, 4.5vw, 2.6rem); letter-spacing: .04em; line-height: 1; }
.splash-title p.lede { position: relative; margin-top: 12px; max-width: 46ch; font-size: 1.05rem; }
.splash-title .row { position: relative; margin-top: 18px; }

.howto { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.howto .panel { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.howto .step { font-family: var(--display); font-size: 1.3rem; line-height: 1; letter-spacing: .03em; }
.howto .big { font-size: 2.6rem; line-height: 1; }
.howto p { font-size: .92rem; color: var(--ink-soft); }
.howto .panel:nth-child(1) { background: #DFF5FF; }
.howto .panel:nth-child(2) { background: #FFE3F2; }
.howto .panel:nth-child(3) { background: #E2F8E6; }
.howto .panel:nth-child(4) { background: #FFF1D6; }

.resume { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 24px; background: var(--ink); color: var(--desk-text); }
.resume b { color: var(--caption); font-family: var(--display); font-size: 1.4rem; letter-spacing: .04em; font-weight: 400; }
.resume .grow { flex: 1; min-width: 200px; }

/* ---------- mode shelves ---------- */
.shelf-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 12px; }
.shelf-head h2 { font-size: clamp(2rem, 5vw, 3rem); background: var(--ink); color: var(--paper); padding: 6px 14px 4px; transform: rotate(-1.5deg); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 4px 14px; border: var(--border); border-radius: 999px; background: var(--paper); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--caption); }
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: var(--gutter); }
.cover {
  position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  background: var(--paper); border: var(--border); border-radius: var(--radius);
  transition: transform .18s cubic-bezier(.2,.8,.2,1);
}
.cover:hover { transform: translateY(-4px) rotate(-1deg); }
.cover:nth-child(3n+2):hover { transform: translateY(-4px) rotate(1deg); }
.cover-art { position: relative; aspect-ratio: 4 / 3; background: var(--c, var(--cyan)); border-bottom: var(--border); overflow: hidden; }
.cover-art::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-conic-gradient(from 0deg at 50% 60%, rgba(255,255,255,.22) 0 8deg, transparent 8deg 22deg);
}
.cover-art::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.16) 22%, transparent 24%); background-size: 9px 9px; }
.cover-art .e { position: absolute; line-height: 1; z-index: 1; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.cover-art .e1 { font-size: 4.8rem; left: 50%; top: 56%; transform: translate(-50%, -50%) rotate(-6deg); }
.cover-art .e2 { font-size: 2.6rem; left: 9%; top: 16%; transform: rotate(-12deg); }
.cover-art .e3 { font-size: 2.4rem; right: 9%; bottom: 10%; transform: rotate(10deg); }
.cover-art .issue { position: absolute; top: 8px; right: 8px; z-index: 2; background: var(--paper); border: 2px solid var(--ink); font-family: var(--display); font-size: .95rem; padding: 0 6px; letter-spacing: .05em; }
.cover-art .price { position: absolute; bottom: 8px; left: 8px; z-index: 2; background: var(--caption); border: 2px solid var(--ink); border-radius: 50%; width: 46px; height: 46px; display: grid; place-items: center; font-family: var(--display); font-size: 1.2rem; transform: rotate(-10deg); }
.cover-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.cover-body h3 { font-size: 1.55rem; }
.cover-body p { font-size: .9rem; color: var(--ink-soft); line-height: 1.3; }
.cover-body .tag { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cover-slot { position: relative; display: flex; }
.cover-slot .cover { flex: 1; }
.cover-slot .edit { position: absolute; top: 8px; left: 8px; z-index: 3; }
.cover.add { align-items: center; justify-content: center; min-height: 240px; background: transparent; border-style: dashed; gap: 8px; font-family: var(--display); font-size: 1.6rem; }
.cover.add svg { width: 44px; height: 44px; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: var(--gutter); }
.gallery .panel { padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.gallery .thumbs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.gallery .thumbs svg { width: 100%; height: auto; display: block; border: 2px solid var(--ink); }
.footer-note { margin-top: 40px; font-size: .9rem; color: var(--ink-soft); max-width: 70ch; }

/* ---------- setup ---------- */
.setup { display: grid; gap: var(--gutter); grid-template-columns: 1fr; }
.setup .panel { padding: 16px; }
.setup h2 { font-size: 2.2rem; margin-bottom: 10px; }
.mode-pick { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
.mode-pick .cover-art { border: var(--border); border-radius: var(--radius); }
.mode-pick .cover-art .e1 { font-size: 3.4rem; }
.mode-pick .cover-art .e2, .mode-pick .cover-art .e3 { font-size: 1.6rem; }
.mode-pick h3 { font-size: 2rem; }
.players-list { display: flex; flex-direction: column; gap: 10px; }
.player-input { display: grid; grid-template-columns: 40px 1fr 48px; gap: 8px; align-items: center; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: var(--border); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.2rem; }
.player-input input, .field input, .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 8px 12px; border: var(--border); border-radius: 8px; background: var(--paper); font-weight: 700;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-family: var(--display); font-size: 1.2rem; letter-spacing: .04em; }
.field .hint { font-size: .85rem; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.seg button { min-height: 56px; padding: 8px 10px; border: var(--border); border-radius: 10px; background: var(--paper); text-align: left; display: flex; flex-direction: column; gap: 2px; }
.seg button b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; letter-spacing: .04em; }
.seg button span { font-size: .82rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button[aria-pressed="true"] span { color: var(--desk-muted); }
.form-error { color: var(--red); font-size: .95rem; min-height: 1.4em; }

/* ---------- game layout ---------- */
.game { display: grid; gap: var(--gutter); grid-template-columns: minmax(0, 1fr); }
.stage { padding: 0; overflow: hidden; }
.stage-inner { position: relative; padding: 18px; display: grid; gap: 14px; min-height: 360px; }
.round-label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.round-label .caption-box { transform: rotate(-1.5deg); }
.round-label .of { font-family: var(--display); font-size: 1.15rem; letter-spacing: .05em; color: var(--muted); }
.curtain { display: grid; place-items: center; text-align: center; gap: 14px; padding: 26px 10px; background: repeating-linear-gradient(90deg, #B5121B 0 26px, #D7263D 26px 52px); border: var(--border); border-radius: var(--radius); color: var(--paper); }
.curtain .q { font-family: var(--display); font-size: clamp(4rem, 12vw, 7rem); line-height: .9; color: var(--caption); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.curtain p { font-size: 1.1rem; max-width: 32ch; background: var(--ink); padding: 6px 12px; border-radius: 6px; }

.item-show { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: center; }
.item-art { position: relative; aspect-ratio: 1; max-width: 300px; width: 100%; margin: 0 auto; display: grid; place-items: center; }
.item-art svg.burst { position: absolute; inset: 0; width: 100%; height: 100%; }
.item-art .e { position: relative; font-size: clamp(5rem, 16vw, 8.5rem); line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.2)); }
.item-text h2 { font-size: clamp(2.6rem, 6vw, 4.2rem); line-height: .95; }
.item-text .desc { margin-top: 8px; font-size: 1.15rem; color: var(--ink-soft); max-width: 40ch; }
.reveal-anim .item-art { animation: slam .55s cubic-bezier(.2,1.4,.4,1) both; }
.reveal-anim .item-text { animation: slide-in .45s .12s cubic-bezier(.2,.9,.3,1) both; }
@keyframes slam { from { transform: scale(2.2) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide-in { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.balloon-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; min-height: 84px; }
.balloon {
  position: relative; background: var(--paper); border: var(--border); border-radius: 28px; padding: 8px 18px;
  font-family: var(--display); font-size: 1.4rem; letter-spacing: .04em; line-height: 1.05;
}
.balloon::after { content: ""; position: absolute; left: 22px; bottom: -14px; width: 18px; height: 14px; background: var(--paper); border-left: var(--border); border-bottom: var(--border); transform: skewX(-30deg); }
.balloon.top { font-size: clamp(1.9rem, 5vw, 2.8rem); background: var(--caption); border-width: 4px; animation: pop-in .35s cubic-bezier(.2,1.5,.4,1); }
.balloon.top::after { background: var(--caption); border-width: 4px; }
.balloon.old { font-size: 1.05rem; opacity: .7; }
.balloon .who { display: block; font-size: .6em; letter-spacing: .08em; }
@keyframes pop-in { from { transform: scale(.4) rotate(-8deg); } to { transform: none; } }
.status-line { font-size: 1.05rem; color: var(--ink-soft); }
.result-banner { padding: 14px 16px; background: var(--ink); color: var(--paper); border-radius: var(--radius); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.result-banner b { font-family: var(--display); font-weight: 400; color: var(--caption); font-size: 1.8rem; letter-spacing: .04em; }

/* host desk */
.desk { background: var(--desk); color: var(--desk-text); border: var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.desk-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.desk-head h3 { font-size: 1.5rem; color: var(--caption); }
.desk-head .note { font-size: .88rem; color: var(--desk-muted); }
.desk .btn { border-color: var(--ink); }
.desk .btn-ghost { --f: var(--desk-text); border-color: var(--desk-line); }
.bid-rows { display: flex; flex-direction: column; gap: 8px; }
.bid-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px; border: 2px solid var(--desk-line); border-radius: 10px; background: #221D1A; }
.bid-row.is-top { border-color: var(--caption); background: #2E2617; }
.bid-row.is-out { opacity: .55; }
.bid-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bid-who .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--paper); flex: none; }
.bid-who .nm { font-family: var(--display); font-size: 1.35rem; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bid-who .bal { margin-left: auto; font-family: var(--display); font-size: 1.35rem; color: #7CF0A5; letter-spacing: .04em; white-space: nowrap; }
.bid-who .flag { font-size: .78rem; background: var(--caption); color: var(--ink); padding: 1px 7px; border-radius: 4px; letter-spacing: .05em; text-transform: uppercase; }
.bid-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bid-btns .btn-small { min-width: 58px; }
.bid-btns .custom { display: flex; gap: 6px; align-items: center; }
.bid-btns input { width: 76px; min-height: 40px; border-radius: 8px; border: 2px solid var(--desk-line); background: #0F0C0B; color: var(--desk-text); padding: 4px 8px; font-family: var(--display); font-size: 1.2rem; }
.desk-msg { min-height: 1.4em; color: #FFB3B3; font-size: .95rem; }
.desk-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* player panels with live creation */
.players-grid { display: grid; gap: var(--gutter); grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); align-content: start; }
.pcard { display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; background: var(--paper); border: var(--border); border-radius: var(--radius); transition: transform .2s; }
.pcard:hover { transform: rotate(-.6deg); }
.pcard.is-top { box-shadow: 0 0 0 5px var(--caption), 0 8px 18px rgba(0,0,0,.25); }
.pcard-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: var(--border); background: var(--pc); color: var(--paper); }
.pcard-head .nm { font-family: var(--display); font-size: 1.5rem; letter-spacing: .04em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard-head .count { font-size: .85rem; background: rgba(0,0,0,.28); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pcard .art { position: relative; background: #EEE; line-height: 0; }
.pcard .art svg { width: 100%; height: auto; display: block; }
.pcard-foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
.money-tag {
  display: inline-flex; align-items: baseline; gap: 2px; padding: 2px 14px 2px 12px;
  background: var(--cash); color: var(--paper); border: var(--border); border-radius: 6px 22px 22px 6px;
  font-family: var(--display); font-size: 2.1rem; line-height: 1.05; letter-spacing: .02em; font-variant-numeric: tabular-nums;
}
.money-tag .cur { font-size: .6em; }
.money-tag.low { background: var(--warn); color: var(--ink); }
.money-tag.zero { background: #CFC8C0; color: var(--ink-soft); }
.money-note { font-size: .82rem; color: var(--muted); line-height: 1.2; }
.money-note.low { color: #B34700; }
.ai-chip { margin-left: auto; font-size: .78rem; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); white-space: nowrap; }
.ai-chip.loading { background: var(--caption); }
.ai-chip.error { background: #FFD6D6; }
.ai-chip.ok { background: #D7F5DD; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--ink); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

.pop { animation: pop 0.9s cubic-bezier(.2,1.6,.4,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { transform: scale(0.1) rotate(-20deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,17,15,.72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.sold-box { width: min(760px, 100%); display: grid; gap: 0; justify-items: center; text-align: center; }
.sold-burst { position: relative; width: min(360px, 80vw, 30vh * 1.7); aspect-ratio: 1.7; margin-bottom: -34px; z-index: 1; display: grid; place-items: center; animation: slam .6s cubic-bezier(.2,1.5,.4,1) both; }
.sold-burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }

<div id="app"><p style="padding:24px;font-family:sans-serif">Loading the auction&hellip;</p></div>
<noscript><p style="padding:24px">The $20 Auction needs JavaScript turned on.</p></noscript>
<script>
/* Core: mode registry, game state, and the auction rules.
   Every money change goes through the functions in this file so the rules live in one place. */
window.TDA = (function () {
  'use strict';

  var T = { modes: [], modeById: {}, START_MONEY: 20 };

  var CATS = {
    dream: 'Build Your Dream',
    food: 'Food & Entertainment',
    action: 'Action & Imagination',
    custom: 'Your Own Modes'
  };
  T.CATS = CATS;

  // Player ink colors: picked to stay distinct from each other on newsprint white.
  T.PLAYER_COLORS = ['#E4002B', '#0072CE', '#00A651', '#FF8200', '#7B2CBF', '#00B5B8', '#E6007E', '#6B4226'];

  /* ---------- mode registry ---------- */

  function parseItem(s) {
    var p = String(s).split('|');
    var item = { name: (p[0] || '').trim(), desc: (p[1] || '').trim(), emoji: (p[2] || '').trim() || '⭐', color: null, shape: null };
    if (item.desc === 'Name') item.desc = 'A name worth fighting for';
    if (p[3]) p[3].split(':').forEach(function (bit) {
      bit = bit.trim();
      if (!bit) return;
      if (bit.charAt(0) === '#') item.color = bit; else item.shape = bit;
    });
    return item;
  }

  function normalizeMode(m) {
    var mode = {
      id: m.id, name: m.name, cat: m.cat || 'custom', kind: m.kind || 'collage', skin: m.skin || m.kind,
      blurb: m.blurb || '', ai: m.ai || ('a dream ' + m.name.replace(/^Dream /, '')),
      cover: m.cover || ['⭐'], color: m.color || '#00A6E8', custom: !!m.custom,
      rounds: m.rounds.map(function (r) {
        return { label: r[0], part: r[1] || 'spot', items: r[2].map(parseItem) };
      })
    };
    return mode;
  }

  T.addModes = function (list) {
    list.forEach(function (m) {
      var mode = normalizeMode(m);
      if (T.modeById[mode.id]) T.modes = T.modes.filter(function (x) { return x.id !== mode.id; });
      T.modes.push(mode);
      T.modeById[mode.id] = mode;
    });
  };
  T.removeMode = function (id) {
    delete T.modeById[id];
    T.modes = T.modes.filter(function (x) { return x.id !== id; });
  };

  /* ---------- storage (always optional) ---------- */

  T.store = {
    get: function (k, fallback) {
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
    },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
  };

  /* ---------- small utilities ---------- */

  T.uid = function () { return Math.random().toString(36).slice(2, 9); };
  T.hash = function (s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  T.rng = function (seed) {
    var a = seed >>> 0 || 1;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  };
  T.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* ---------- game setup ---------- */

  // Pick which rounds are played (keeping the mode's order) and one random item per round.
  function drawRounds(mode, count, rand) {
    var idx = mode.rounds.map(function (_, i) { return i; });
    while (idx.length > count) idx.splice(Math.floor(rand() * idx.length), 1);
    return idx.map(function (i) {
      var r = mode.rounds[i];
      var item = r.items[Math.floor(rand() * r.items.length)];
      return { label: r.label, part: r.part, item: JSON.parse(JSON.stringify(item)) };
    });
  }

  T.newGame = function (modeId, names, opts) {
    var mode = T.modeById[modeId];
    if (!mode) throw new Error('Unknown mode');
    opts = opts || {};
    var rand = T.rng(Date.now() ^ T.hash(modeId + names.join()));
    var count = Math.min(opts.rounds || mode.rounds.length, mode.rounds.length);
    return {
      v: 1,
      id: T.uid(),
      started: Date.now(),
      modeId: modeId,
      bidStyle: opts.bidStyle === 'secret' ? 'secret' : 'live',
      players: names.map(function (n, i) {
        return {
          id: 'p' + i + T.uid(), name: n, color: T.PLAYER_COLORS[i % T.PLAYER_COLORS.length],
          balance: T.START_MONEY, wins: [], missed: [],
          ai: { status: 'idle', url: null, sig: null, error: null }
        };
      }),
      rounds: drawRounds(mode, count, rand),
      roundIndex: 0,
      phase: 'curtain',          // curtain -> preview -> bidding -> sold | unclaimed | skipped -> (next) curtain ... -> over
      auction: freshAuction(),
      history: [],
      votes: {},
      over: false
    };
  };

  function freshAuction() {
    return { log: [], secret: null, tieWith: null };
  }

  T.mode = function (g) { return T.modeById[g.modeId]; };
  T.currentRound = function (g) { return g.rounds[g.roundIndex] || null; };
  T.player = function (g, id) {
    for (var i = 0; i < g.players.length; i++) if (g.players[i].id === id) return g.players[i];
    return null;
  };
  T.spent = function (p) { return p.wins.reduce(function (s, w) { return s + w.price; }, 0); };

  /* ---------- live auction state (derived from the log, so Undo is exact) ---------- */

  T.auctionState = function (g) {
    var high = null, passed = {}, bidders = {};
    g.auction.log.forEach(function (e) {
      if (e.type === 'bid') { high = { pid: e.pid, amount: e.amount }; bidders[e.pid] = true; delete passed[e.pid]; }
      if (e.type === 'pass') passed[e.pid] = true;
    });
    return { high: high, passed: passed, bidders: bidders };
  };

  // Why a player can or cannot bid an amount right now. Returns '' when allowed.
  T.bidProblem = function (g, pid, amount) {
    var p = T.player(g, pid);
    if (!p) return 'Pick a player first.';
    if (g.phase !== 'bidding') return 'Bidding is not open.';
    if (!Number.isInteger(amount)) return 'Bids are whole dollars.';
    if (amount < 1) return 'The lowest bid is $1.';
    if (p.balance <= 0) return p.name + ' is out of money.';
    if (amount > p.balance) return p.name + ' only has $' + p.balance + '.';
    var st = T.auctionState(g);
    if (st.high && st.high.pid === pid) return p.name + ' already has the top bid.';
    if (st.high && amount <= st.high.amount) return 'Beat $' + st.high.amount + '. Bid at least $' + (st.high.amount + 1) + '.';
    return '';
  };

  T.placeBid = function (g, pid, amount) {
    var why = T.bidProblem(g, pid, amount);
    if (why) return why;
    g.auction.log.push({ type: 'bid', pid: pid, amount: amount });
    return '';
  };

  T.pass = function (g, pid) {
    var st = T.auctionState(g);
    if (g.phase !== 'bidding') return 'Bidding is not open.';
    if (st.high && st.high.pid === pid) return 'The top bidder cannot pass. Undo their bid instead.';
    if (st.passed[pid]) return '';
    g.auction.log.push({ type: 'pass', pid: pid });
    return '';
  };

  T.undo = function (g) { return g.auction.log.pop() || null; };

  // Who is still able to beat the current high bid.
  T.stillIn = function (g) {
    var st = T.auctionState(g);
    var min = st.high ? st.high.amount + 1 : 1;
    return g.players.filter(function (p) {
      return !st.passed[p.id] && !(st.high && st.high.pid === p.id) && p.balance >= min;
    });
  };

  /* ---------- round flow ---------- */

  T.reveal = function (g) { if (g.phase === 'curtain') g.phase = 'preview'; };
  T.openBidding = function (g) {
    if (g.phase !== 'preview') return;
    g.phase = 'bidding';
    g.auction = freshAuction();
    if (g.bidStyle === 'secret') T.startSecret(g, null);
  };

  // Close the auction. The top bidder pays exactly their bid; nobody else pays anything.
  T.closeAuction = function (g) {
    if (g.phase !== 'bidding') return null;
    var round = T.currentRound(g);
    var st = T.auctionState(g);
    if (!st.high) {
      g.phase = 'unclaimed';
      g.history.push({ round: g.roundIndex, result: 'unclaimed' });
      return { result: 'unclaimed' };
    }
    var winner = T.player(g, st.high.pid);
    var price = st.high.amount;
    if (price > winner.balance) return null; // can never happen through placeBid, guarded anyway
    winner.balance -= price;
    winner.wins.push({ round: g.roundIndex, label: round.label, part: round.part, item: round.item, price: price });
    Object.keys(st.bidders).forEach(function (pid) {
      if (pid !== winner.id) {
        var loser = T.player(g, pid);
        var best = 0;
        g.auction.log.forEach(function (e) { if (e.type === 'bid' && e.pid === pid) best = Math.max(best, e.amount); });
        loser.missed.push({ round: g.roundIndex, name: round.item.name, emoji: round.item.emoji, myBid: best, soldFor: price, to: winner.name });
      }
    });
    g.phase = 'sold';
    g.history.push({ round: g.roundIndex, result: 'sold', pid: winner.id, price: price });
    return { result: 'sold', winner: winner, price: price };
  };

  T.skip = function (g) {
    if (g.phase === 'sold' || g.phase === 'unclaimed' || g.phase === 'skipped' || g.over) return;
    g.phase = 'skipped';
    g.auction = freshAuction();
    g.history.push({ round: g.roundIndex, result: 'skipped' });
  };

  T.isLastRound = function (g) { return g.roundIndex >= g.rounds.length - 1; };

  T.next = function (g) {
    if (!(g.phase === 'sold' || g.phase === 'unclaimed' || g.phase === 'skipped')) return;
    if (T.isLastRound(g) || g.players.every(function (p) { return p.balance === 0; })) { T.endGame(g); return; }
    g.roundIndex += 1;
    g.phase = 'curtain';
    g.auction = freshAuction();
  };

  T.endGame = function (g) {
    g.over = true;
    g.phase = 'over';
    g.auction = freshAuction();
  };

  T.everyoneBroke = function (g) { return g.players.every(function (p) { return p.balance === 0; }); };

  /* ---------- secret (pass-the-device) bidding ---------- */

  T.startSecret = function (g, onlyIds) {
    var ids = (onlyIds || g.players.map(function (p) { return p.id; })).filter(function (id) {
      return T.player(g, id).balance > 0;
    });
    g.auction.log = [];
    g.auction.secret = { order: ids, idx: 0, entries: {}, shown: false, floor: onlyIds ? g.auction.tieWith : 0 };
  };

  T.secretProblem = function (g, pid, amount) {
    var p = T.player(g, pid);
    var s = g.auction.secret;
    if (!Number.isInteger(amount) || amount < 0) return 'Enter a whole-dollar amount.';
    if (amount > p.balance) return p.name + ' only has $' + p.balance + '.';
    if (s && s.floor && amount > 0 && amount < s.floor) return 'This is a tie-breaker: bid at least $' + s.floor + ' or pass.';
    return '';
  };

  T.secretEnter = function (g, amount) {
    var s = g.auction.secret;
    var pid = s.order[s.idx];
    var why = T.secretProblem(g, pid, amount);
    if (why) return why;
    s.entries[pid] = amount;
    s.idx += 1;
    s.shown = false;
    return '';
  };

  T.secretDone = function (g) { var s = g.auction.secret; return !!s && s.idx >= s.order.length; };

  // Turn sealed bids into a result: a single top bid becomes the live high bid; a tie asks the tied players again.
  T.secretResolve = function (g) {
    var s = g.auction.secret;
    var top = 0, tops = [];
    Object.keys(s.entries).forEach(function (pid) {
      var a = s.entries[pid];
      if (a > top) { top = a; tops = [pid]; } else if (a === top && a > 0) tops.push(pid);
    });
    if (top === 0) return { kind: 'none' };
    if (tops.length > 1) { g.auction.tieWith = top; return { kind: 'tie', ids: tops, amount: top }; }

    h += '<p class="footer-note">Tip: the host can tap “Hide host desk” during the game to show only the stage on a TV. Games save in this browser automatically, so a refresh will not lose anyone’s money.</p>';
    return h + '</div>';
  }

  /* ---------- SETUP ---------- */
  function setupScreen() {
    var s = UI.setup, m = T.modeById[s.modeId];
    var h = '<div class="wrap"><div class="topbar"><button class="btn btn-small" data-act="go-home">' + icon('back') + ' All games</button><span class="spacer"></span><span class="logo">$20 Auction</span></div>';
    h += '<div class="setup">';
    h += '<section class="panel span2"><div class="mode-pick">' + coverArt(m) + '<div><h3>' + esc(m.name) + '</h3><p>' + esc(m.blurb) + '</p><p class="hint" style="margin-top:6px;color:var(--muted)">' + m.rounds.length + ' different auction rounds, with random items each game.</p></div></div></section>';
    h += '<section class="panel"><h2>Who’s playing?</h2><div class="players-list">';
    s.names.forEach(function (n, i) {
      h += '<div class="player-input"><span class="swatch" style="background:' + T.PLAYER_COLORS[i] + '">' + (i + 1) + '</span>' +
        '<input id="pname-' + i + '" data-input="pname" data-i="' + i + '" value="' + esc(n) + '" placeholder="Player ' + (i + 1) + ' name" maxlength="16" autocomplete="off" aria-label="Player ' + (i + 1) + ' name">' +
        '<button class="btn btn-small icon-btn" data-act="remove-player" data-i="' + i + '" ' + (s.names.length <= 2 ? 'disabled' : '') + ' aria-label="Remove player ' + (i + 1) + '">' + icon('minus') + '</button></div>';
    });
    h += '</div><div class="row" style="margin-top:12px"><button class="btn btn-small" data-act="add-player" ' + (s.names.length >= 8 ? 'disabled' : '') + '>' + icon('plus') + ' Add player</button><span class="hint" style="color:var(--muted)">' + s.names.length + ' of 8 players. Each gets $20.</span></div></section>';
    h += '<section class="panel"><h2>Game options</h2><div style="display:flex;flex-direction:column;gap:14px">';
    var max = m.rounds.length, quick = Math.min(6, max);
    h += '<div class="field"><span class="lbl">How long?</span><div class="seg">' +
      '<button data-act="set-opt" data-k="rounds" data-v="' + quick + '" aria-pressed="' + (s.rounds === quick) + '"><b>Quick</b><span>' + quick + ' items, about 10 minutes</span></button>' +
      '<button data-act="set-opt" data-k="rounds" data-v="' + max + '" aria-pressed="' + (s.rounds === max) + '"><b>Full game</b><span>' + max + ' items, about 20 minutes</span></button></div></div>';
    h += '<div class="field"><span class="lbl">How do people bid?</span><div class="seg">' +
      '<button data-act="set-opt" data-k="bidStyle" data-v="live" aria-pressed="' + (s.bidStyle === 'live') + '"><b>Out loud</b><span>Shout bids, the host taps them in</span></button>' +
      '<button data-act="set-opt" data-k="bidStyle" data-v="secret" aria-pressed="' + (s.bidStyle === 'secret') + '"><b>Secret bids</b><span>Pass the device, bid privately</span></button></div></div>';
    h += '<div class="field"><span class="lbl">Extras</span><div class="seg">' +
      '<button data-act="toggle-setting" data-k="ai" aria-pressed="' + SETTINGS.ai + '"><b>AI paintings ' + (SETTINGS.ai ? 'on' : 'off') + '</b><span>' + (AI_BLOCKED ? 'Not available on this page' : 'Free painter (Pollinations.ai) paints each creation') + '</span></button>' +
      '<button data-act="toggle-setting" data-k="sound" aria-pressed="' + SETTINGS.sound + '"><b>Sound ' + (SETTINGS.sound ? 'on' : 'off') + '</b><span>Bids, gavel and fanfare</span></button></div></div>';
    h += '</div></section>';
    if (G && !G.over) h += '<section class="panel span2" style="background:#FFF4D6"><p>Heads up: a game of ' + esc(T.mode(G).name) + ' is still in progress. Starting this one replaces it.</p></section>';
    h += '<section class="panel span2"><div class="row"><button class="btn btn-red btn-big" data-act="start-game">' + icon('gavel') + ' Start the auction</button><span class="form-error" role="alert">' + esc(UI.msg) + '</span></div></section>';
    return h + '</div></div>';
  }

  /* ---------- GAME ---------- */
  function gameScreen() {
    var g = G, m = T.mode(g), round = T.currentRound(g), st = T.auctionState(g);
    var h = '<div class="wrap">';
    h += '<div class="topbar"><button class="logo" data-act="go-home" aria-label="Home">$20 Auction</button><span class="round-tag">' + esc(m.name) + ' · item ' + (g.roundIndex + 1) + ' of ' + g.rounds.length + '</span><span class="spacer"></span>' +
      '<button class="btn btn-small icon-btn" data-act="toggle-sound" aria-label="' + (SETTINGS.sound ? 'Mute sound' : 'Turn sound on') + '">' + icon(SETTINGS.sound ? 'soundOn' : 'soundOff') + '</button>' +
      '<button class="btn btn-small" data-act="toggle-show">' + icon('eye') + (UI.showMode ? ' Show host desk' : ' Hide host desk') + '</button>' +
      '<button class="btn btn-small btn-ink" data-act="open-host">' + icon('menu') + ' Host menu</button></div>';
    h += '<div class="game' + (UI.showMode ? ' show-mode' : '') + '"><div class="left">';
    // stage
    h += '<section class="panel stage" aria-live="polite"><div class="stage-inner' + (UI.reveal ? ' reveal-anim' : '') + '">';
    h += '<div class="round-label"><span class="caption-box">Item ' + (g.roundIndex + 1) + '</span><span class="of">of ' + g.rounds.length + '</span></div>';
    if (g.phase === 'curtain') {
      h += '<div class="curtain"><div class="q">???</div><p>The host is about to reveal the next item. Get your bidding hands ready!</p></div>';
    } else {
      h += '<div class="item-show"><div class="item-art">' + burst(m.color === '#14110F' ? '#FFE94D' : '#FFE94D') + '<span class="e">' + esc(round.item.emoji) + '</span></div>' +
        '<div class="item-text"><span class="caption-box" style="font-size:1rem">' + esc(round.label) + '</span><h2 style="margin-top:10px">' + esc(round.item.name) + '</h2><p class="desc">' + esc(round.item.desc) + '</p></div></div>';
      if (g.phase === 'preview') h += '<p class="status-line">Read it out loud! Bidding opens when the host says go.</p>';
      if (g.phase === 'bidding') {
        if (g.bidStyle === 'secret') {
          var s = g.auction.secret;
          h += '<div class="balloon-row"><div class="balloon top"><span class="who">SECRET BIDS</span>' + (s ? Object.keys(s.entries).length : 0) + ' of ' + (s ? s.order.length : 0) + ' locked in</div></div>';
        } else {
          var bids = g.auction.log.filter(function (e) { return e.type === 'bid'; }).slice(-4).reverse();
          h += '<div class="balloon-row">';
          if (!bids.length) h += '<div class="balloon top"><span class="who">OPENING BID</span>Who’ll start at $1?</div>';
          bids.forEach(function (b, i) {
            var p = T.player(g, b.pid);
            h += '<div class="balloon ' + (i === 0 ? 'top' : 'old') + '"' + (i === 0 ? ' style="border-color:' + p.color + '"' : '') + '><span class="who">' + esc(p.name.toUpperCase()) + '</span>$' + b.amount + (i === 0 ? '!' : '') + '</div>';
          });
          h += '</div>';
        }
      }
      var last = g.history[g.history.length - 1];
      if (g.phase === 'sold' && last) {
        var w = T.player(g, last.pid);
        h += '<div class="result-banner"><b>SOLD!</b><span>' + esc(w.name) + ' won ' + esc(round.item.name) + ' for $' + last.price + '.</span></div>';
      }
      if (g.phase === 'unclaimed') h += '<div class="result-banner"><b>No sale!</b><span>Nobody bid. ' + esc(round.item.name) + ' goes unclaimed.</span></div>';
      if (g.phase === 'skipped') h += '<div class="result-banner"><b>Skipped</b><span>The host skipped this item. No money changed hands.</span></div>';
    }
    h += '</div></section>';
    h += deskPanel();
    h += '</div>';
    // players
    h += '<section class="players-grid" aria-label="Players">';
    g.players.forEach(function (p) {
      var top = g.phase === 'bidding' && st.high && st.high.pid === p.id;
      h += '<button class="pcard' + (top ? ' is-top' : '') + '" style="--pc:' + p.color + '" data-act="open-player" data-pid="' + p.id + '" aria-label="' + esc(p.name) + ', $' + p.balance + ' left. Open dashboard">' +
        '<div class="pcard-head"><span class="nm">' + esc(p.name) + '</span><span class="count">' + p.wins.length + (p.wins.length === 1 ? ' item' : ' items') + '</span></div>' +
        '<div class="art">' + creationSvg(g, p, { pop: true }) + '</div>' +
        '<div class="pcard-foot">' + money(p.balance, moneyClass(p)) + moneyNote(p) + aiChip(p) + '</div></button>';
    });
    h += '</section></div>';
    return h + '</div>';
  }

  function deskPanel() {
    var g = G, st = T.auctionState(g);
    var h = '<section class="desk" aria-label="Host desk"><div class="desk-head"><h3>Host desk</h3><span class="note">Only the host taps here.</span></div>';
    if (g.phase === 'curtain') {
      h += '<div class="desk-actions"><button class="btn btn-yellow btn-big" data-act="reveal">Reveal item ' + (g.roundIndex + 1) + '</button><button class="btn btn-ghost" data-act="skip">' + icon('skip') + ' Skip item</button></div>';
    } else if (g.phase === 'preview') {
      h += '<div class="desk-actions"><button class="btn btn-cash btn-big" data-act="open-bidding">' + icon('gavel') + (g.bidStyle === 'secret' ? ' Start secret bids' : ' Start bidding') + '</button><button class="btn btn-ghost" data-act="skip">' + icon('skip') + ' Skip item</button></div>';
    } else if (g.phase === 'bidding' && g.bidStyle === 'secret') {
      h += secretDesk();
    } else if (g.phase === 'bidding') {
      var min = st.high ? st.high.amount + 1 : 1;
      h += '<div class="bid-rows">';
      g.players.forEach(function (p) {
        var isTop = st.high && st.high.pid === p.id, passed = st.passed[p.id], broke = p.balance < min && !isTop;
        var flag = isTop ? 'Top bid $' + st.high.amount : passed ? 'Passed' : p.balance === 0 ? 'Out of money' : broke ? 'Can’t beat $' + st.high.amount : '';
        h += '<div class="bid-row' + (isTop ? ' is-top' : '') + (passed || broke ? ' is-out' : '') + '"><div class="bid-who"><span class="dot" style="background:' + p.color + '"></span><span class="nm">' + esc(p.name) + '</span>' + (flag ? '<span class="flag">' + esc(flag) + '</span>' : '') + '<span class="bal">$' + p.balance + '</span></div>';
        if (!isTop && !passed && !broke) {
          var amounts = [min, min + 1, min + 4, p.balance].filter(function (a, i, arr) { return a <= p.balance && arr.indexOf(a) === i; });
          h += '<div class="bid-btns">' + amounts.map(function (a) {
            return '<button class="btn btn-small btn-cash" data-act="bid" data-pid="' + p.id + '" data-amt="' + a + '">' + (a === p.balance && a > min ? 'All in $' : '$') + a + '</button>';
          }).join('') +
            '<span class="custom"><label class="sr-only" for="cb-' + p.id + '">Exact bid for ' + esc(p.name) + '</label><input id="cb-' + p.id + '" type="number" inputmode="numeric" min="' + min + '" max="' + p.balance + '" step="1" placeholder="$"><button class="btn btn-small" data-act="bid-custom" data-pid="' + p.id + '">Bid</button></span>' +
            '<button class="btn btn-small btn-ghost" data-act="pass" data-pid="' + p.id + '">Pass</button></div>';
        } else h += '<div></div>';
        h += '</div>';
      });
      h += '</div>';
      var left = T.stillIn(g);
      var hint = st.high && !left.length ? 'Everyone else is out. Bang the gavel!' : '';
      h += '<p class="desk-msg" role="alert">' + esc(UI.msg || hint) + '</p>';
      h += '<div class="desk-actions">';
      if (st.high) h += '<button class="btn btn-red btn-big" data-act="sell">' + icon('gavel') + ' SOLD to ' + esc(T.player(g, st.high.pid).name) + ' for $' + st.high.amount + '</button>';
      else h += '<button class="btn btn-big" data-act="sell">No bids: leave it unclaimed</button>';
      h += '<button class="btn btn-ghost" data-act="undo" ' + (g.auction.log.length ? '' : 'disabled') + '>' + icon('undo') + ' Undo last</button>' +
        '<button class="btn btn-ghost" data-act="skip">' + icon('skip') + ' Skip item</button></div>';
    } else if (g.phase === 'sold' || g.phase === 'unclaimed' || g.phase === 'skipped') {
      var lastRound = T.isLastRound(g) || T.everyoneBroke(g);
      h += '<div class="desk-actions"><button class="btn btn-yellow btn-big" data-act="next">' + (lastRound ? 'See the final results ' : 'Next item ') + icon('arrow') + '</button></div>';
      if (T.everyoneBroke(g) && !T.isLastRound(g)) h += '<p class="note" style="color:var(--desk-muted)">Everyone is out of money, so the auction is over.</p>';
    }
    return h + '</section>';
  }

  function secretDesk() {
    var g = G, s = g.auction.secret, h = '';
    if (!s) return '';
    if (!T.secretDone(g)) {
      var p = T.player(g, s.order[s.idx]);
      h += '<p>Secret bids: ' + Object.keys(s.entries).length + ' of ' + s.order.length + ' locked in.' + (s.floor ? ' Tie-breaker: bid at least $' + s.floor + ' or pass.' : '') + '</p>';
      h += '<div class="desk-actions"><button class="btn btn-yellow btn-big" data-act="secret-open">Hand the device to ' + esc(p.name) + ' ' + icon('arrow') + '</button><button class="btn btn-ghost" data-act="skip">' + icon('skip') + ' Skip item</button></div>';
    } else {
      h += '<p>All secret bids are in.</p><div class="desk-actions"><button class="btn btn-red btn-big" data-act="secret-reveal">' + icon('gavel') + ' Reveal the bids</button><button class="btn btn-ghost" data-act="skip">' + icon('skip') + ' Skip item</button></div>';
    }
    return h;
  }

  /* ---------- overlays ---------- */
  function soldOverlay(o) {
    var g = G, p = T.player(g, o.pid), round = g.rounds[o.round];
    var last = T.isLastRound(g) || T.everyoneBroke(g);
    return '<div class="overlay" role="dialog" aria-modal="true" aria-label="Sold"><div class="sold-box">' +
      '<div class="sold-burst">' + burst('#E4002B', 14, 0.62).replace('class="burst"', '') + '<span>SOLD!</span></div>' +
      '<div class="panel sold-card"><h2>' + esc(p.name) + ' wins ' + esc(round.item.emoji) + ' ' + esc(round.item.name) + '!</h2>' +
      '<div class="sold-money">Paid $' + o.price + ' · ' + money('<span data-ticker data-from="' + o.before + '" data-to="' + p.balance + '">' + o.before + '</span>', moneyClass(p)) + ' left</div>' +
      '<div class="art">' + creationSvg(g, p, { pop: true }) + '</div>' +
      (SETTINGS.ai ? '<p class="empty-note">The AI painter is updating ' + esc(p.name) + '’s painting in the background.</p>' : '') +
      '<div class="row" style="justify-content:center"><button class="btn btn-yellow btn-big" data-act="next-from-overlay">' + (last ? 'See final results ' : 'Next item ') + icon('arrow') + '</button><button class="btn" data-act="close-overlay">Look around</button></div></div>' +
      '</div></div>';
  }
  function unclaimedOverlay() {
    var round = T.currentRound(G);
    return '<div class="overlay" role="dialog" aria-modal="true" aria-label="No sale"><div class="sold-box"><div class="sold-burst">' + burst('#8D99AE', 12, 0.7).replace('class="burst"', '') + '<span style="font-size:clamp(3rem,10vw,5rem)">NO SALE</span></div>' +
      '<div class="panel sold-card"><h2>' + esc(round.item.name) + ' goes unclaimed.</h2><p>Nobody bid, so everyone keeps their money.</p>' +
      '<div class="row" style="justify-content:center"><button class="btn btn-yellow btn-big" data-act="next-from-overlay">' + (T.isLastRound(G) ? 'See final results ' : 'Next item ') + icon('arrow') + '</button><button class="btn" data-act="close-overlay">Close</button></div></div></div></div>';
  }
  function secretOverlay() {
    var g = G, s = g.auction.secret, o = UI.overlay;
    if (o.step === 'cover') {
      var p = T.player(g, s.order[s.idx]);
      return '<div class="overlay" role="dialog" aria-modal="true"><div class="panel secret"><h2>Pass to ' + esc(p.name) + '</h2><p>Everyone else, look away!</p><button class="btn btn-red btn-big" data-act="secret-show">I’m ' + esc(p.name) + ', show my bid pad</button><button class="btn btn-small" data-act="close-overlay">Back to host desk</button></div></div>';
    }
    if (o.step === 'pad') {
      var pp = T.player(g, s.order[s.idx]), round = T.currentRound(g);
      var keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'];
      return '<div class="overlay" role="dialog" aria-modal="true"><div class="panel secret"><h2>' + esc(pp.name) + '’s secret bid</h2>' +
        '<p>For ' + esc(round.item.emoji) + ' <b>' + esc(round.item.name) + '</b>. You have ' + money(pp.balance, moneyClass(pp)) + '</p>' +
        '<div class="secret-amount" aria-live="polite">$' + (o.amt || 0) + '</div>' +
        '<div class="keypad">' + keys.map(function (k) { return '<button data-act="secret-key" data-k="' + k + '" aria-label="' + (k === 'C' ? 'Clear' : k === '⌫' ? 'Delete' : k) + '">' + k + '</button>'; }).join('') + '</div>' +
        '<p class="form-error" role="alert">' + esc(UI.msg) + '</p>' +
        '<div class="row" style="justify-content:center"><button class="btn btn-cash btn-big" data-act="secret-lock" ' + (o.amt > 0 ? '' : 'disabled') + '>Lock in $' + (o.amt || 0) + '</button><button class="btn btn-big" data-act="secret-pass">Pass</button></div></div></div>';
    }
    if (o.step === 'locked') {
      var next = T.secretDone(g) ? null : T.player(g, s.order[s.idx]);
      return '<div class="overlay" role="dialog" aria-modal="true"><div class="panel secret"><h2>Locked in!</h2><p>Your bid is secret.</p>' +
        (next ? '<button class="btn btn-red btn-big" data-act="secret-cover">Pass to ' + esc(next.name) + ' ' + icon('arrow') + '</button>' : '<button class="btn btn-yellow btn-big" data-act="close-overlay">Give the device back to the host</button>') + '</div></div>';
    }
    if (o.step === 'reveal') {
      var entries = Object.keys(o.entries).map(function (id) { return { p: T.player(g, id), a: o.entries[id] }; }).sort(function (a, b) { return b.a - a.a; });
      var res = o.result;
      var h = '<div class="overlay" role="dialog" aria-modal="true"><div class="panel secret"><h2>The secret bids</h2><div class="reveal-list">';
      entries.forEach(function (e) { h += '<div class="' + (res.kind === 'winner' && e.p.id === res.pid ? 'win' : '') + '"><span>' + esc(e.p.name) + '</span><span>' + (e.a ? '$' + e.a : 'Pass') + '</span></div>'; });
      h += '</div>';
      if (res.kind === 'winner') h += '<button class="btn btn-red btn-big" data-act="sell">' + icon('gavel') + ' SOLD to ' + esc(T.player(g, res.pid).name) + ' for $' + res.amount + '</button>';
      else if (res.kind === 'tie') h += '<p>It’s a tie at $' + res.amount + ' between ' + res.ids.map(function (id) { return esc(T.player(g, id).name); }).join(' and ') + '!</p><button class="btn btn-yellow btn-big" data-act="secret-tie">Tie-breaker: they bid again</button>';
      else h += '<p>Everybody passed.</p><button class="btn btn-big" data-act="sell">Leave it unclaimed</button>';
      return h + '</div></div>';
    }
    return '';
  }

  /* ---------- drawers ---------- */
  function aiBox(g, p, readOnly) {
    var a = p.ai || {};
    var compact = !a.url && a.status !== 'loading';
    var h = '<div class="ai-box">' + (compact ? '' : '<div class="ai-frame">');
    if (a.url) h += '<img src="' + esc(a.url) + '" alt="AI painting of ' + esc(p.name) + '’s creation" referrerpolicy="no-referrer">';
    if (a.status === 'loading') h += a.url ? '<span class="ai-loading"><span class="spin"></span> Painting the newest win…</span>' : '<p><span class="spin"></span> The AI painter is working. This takes 10 to 40 seconds.</p>';
    h += (compact ? '' : '</div>') + '<div class="ai-bar"' + (compact ? ' style="border-top:0"' : '') + '><span class="grow">';
    if (compact && a.status !== 'error') h += (AI_BLOCKED ? AI_BLOCKED_MSG : !SETTINGS.ai && !readOnly ? 'AI paintings are off. Turn them on in Host menu \u2192 Settings.' : p.wins.length ? 'No AI painting yet. ' : 'Win an item and the AI painter will paint this creation.');
    if (a.status === 'error') h += '<b style="color:var(--red)">Painting failed.</b> ' + esc(a.error || '') + (a.url ? ' Showing the last painting that worked.' : '') + ' The drawn creation is always up to date.';
    else if (a.status === 'ok' && a.sig !== T.AI.signature(p)) h += 'New wins since this painting.';
    else if (a.status === 'ok') h += 'AI painting of all ' + p.wins.length + ' features, by ' + T.AI.provider + '.';
    else if (a.status === 'loading') h += 'Painting with every feature ' + esc(p.name) + ' owns.';
    else if (!compact) h += 'AI painter: ' + T.AI.provider + ' (free).';
    h += '</span>';
    if (!readOnly && SETTINGS.ai && p.wins.length && a.status !== 'loading') {
      var label = a.status === 'error' ? 'Try again' : a.url ? (a.sig !== T.AI.signature(p) ? 'Update painting' : 'Repaint') : 'Paint it now';
      h += '<button class="btn btn-small" data-act="ai-paint" data-pid="' + p.id + '">' + icon(a.status === 'error' ? 'redo' : 'brush') + ' ' + label + '</button>';
    }
    if (a.url) h += '<a class="btn btn-small" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">Open full size</a>';
    return h + '</div></div>';
  }

  function itemList(wins) {
    if (!wins.length) return '<p class="empty-note">No items yet.</p>';
    return '<ul class="item-list">' + wins.map(function (w) {
      return '<li><span class="e">' + esc(w.item.emoji) + '</span><span class="n">' + esc(w.item.name) + '<small>' + esc(w.label) + '</small></span><span class="p">$' + w.price + '</span></li>';
    }).join('') + '</ul>';
  }

  function playerDrawer(pid) {
    var g = G, p = T.player(g, pid);
    if (!p) return '';
    var spent = T.spent(p);
    var h = '<div class="drawer-scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(p.name) + ' dashboard">';
    h += '<div class="drawer-head"><span class="swatch" style="background:' + p.color + '"></span><h2>' + esc(p.name) + '</h2><button class="btn btn-small icon-btn" data-act="close-drawer" aria-label="Close">' + icon('x') + '</button></div>';

    var best = 0, champs = [];
    Object.keys(counts).forEach(function (pid) { if (counts[pid] > best) { best = counts[pid]; champs = [pid]; } else if (counts[pid] === best) champs.push(pid); });
    var votedAll = T.VOTE_CATS.every(function (c) { return (g.votes || {})[c[0]]; });

  function runTickers() {
    app.querySelectorAll('[data-ticker]').forEach(function (el) {
      var from = +el.dataset.from, to = +el.dataset.to;
      if (from === to) return;
      delete el.dataset.ticker;
      var t0 = performance.now(), dur = 900;
      (function step(t) {
        var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = Math.round(from + (to - from) * e);
        if (el.textContent !== String(v)) { el.textContent = v; T.Sound.play('tick'); }
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    });
  }

  /* ---------- confetti ---------- */
  function confetti(colors) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = document.createElement('canvas');
    c.className = 'confetti';
    document.body.appendChild(c);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var parts = [];
    for (var i = 0; i < 140; i++) parts.push({ x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, c: colors[i % colors.length] });
    var t0 = performance.now();
    (function frame(t) {
      x.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(function (p) {
        p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.strokeStyle = '#14110F'; x.lineWidth = 1.5;
        x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
      });
      if (t - t0 < 2600) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  /* ---------- AI painting flow ---------- */

    var g = G, p = T.player(g, pid);

  /* ---------- custom mode editor ---------- */
  var PART_FOR = { collage: 'spot', spread: 'meal', map: 'spot', building: 'room', team: 'member' };
  var EMOJI_START = /^(\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic}|\p{Emoji_Modifier})*)\s*/u;
  function parseEditor(e) {
    var name = e.name.trim();
    if (!name) return { err: 'Give your mode a name.' };
    var lines = e.rounds.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    var rounds = [], err = '';
    lines.forEach(function (l, i) {
      var c = l.indexOf(':');
      if (c < 1) { err = err || 'Line ' + (i + 1) + ' needs a round name and a colon, like “Bed: Hammock, Bunk bed”.'; return; }
      var items = l.slice(c + 1).split(',').map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) {
        var em = '⭐', m = EMOJI_START.exec(s);
        if (m) { em = m[1]; s = s.slice(m[0].length); }
        var desc = '', d = /\(([^)]*)\)\s*$/.exec(s);
        if (d) { desc = d[1].trim(); s = s.slice(0, d.index).trim(); }
        return [s || 'Mystery item', desc || 'A custom pick', em].join('|');
      });
      if (!items.length) { err = err || 'Line ' + (i + 1) + ' has no items after the colon.'; return; }
      rounds.push([l.slice(0, c).trim(), PART_FOR[e.kind], items]);
    });
    if (err) return { err: err };
    if (rounds.length < 3) return { err: 'Add at least 3 rounds (one per line).' };
    var cover = [];
    var rest = e.cover.trim(), m;
    while (rest && (m = EMOJI_START.exec(rest)) && cover.length < 3) { cover.push(m[1]); rest = rest.slice(m[0].length); }
    if (!cover.length) cover = rounds.slice(0, 3).map(function (r) { return r[2][0].split('|')[2]; });
    return {
      mode: {
        id: e.id || 'custom-' + T.uid(), name: /^dream /i.test(name) ? name : 'Dream ' + name, cat: 'custom', custom: true,
        kind: e.kind, skin: e.kind === 'map' ? 'island' : e.kind === 'building' ? 'house' : e.kind === 'spread' ? 'day' : e.kind === 'team' ? 'powers' : 'collage',
        blurb: e.blurb.trim() || 'A family-made mode.', ai: 'a dream ' + name.replace(/^dream /i, ''), color: e.color, cover: cover, rounds: rounds
      }

    'go-home': function () { UI.screen = 'home'; UI.drawer = null; UI.overlay = null; UI.galleryIdx = null; render(); window.scrollTo(0, 0); },
    'view-gallery': function (el) { UI.galleryIdx = +el.dataset.i; UI.screen = 'results'; render(); window.scrollTo(0, 0); },
    'add-player': function () { if (UI.setup.names.length < 8) { UI.setup.names.push(''); render(); var el = document.getElementById('pname-' + (UI.setup.names.length - 1)); if (el) el.focus(); } },
    'remove-player': function (el) { if (UI.setup.names.length > 2) { UI.setup.names.splice(+el.dataset.i, 1); render(); } },
    'set-opt': function (el) { var v = el.dataset.v; UI.setup[el.dataset.k] = el.dataset.k === 'rounds' ? +v : v; render(); },
    'toggle-setting': function (el) {
      var k = el.dataset.k;
      if (k === 'ai' && AI_BLOCKED) { toast(AI_BLOCKED_MSG); return; }
      SETTINGS[k] = !SETTINGS[k]; saveSettings();
      if (k === 'sound') { T.Sound.on = SETTINGS.sound; if (SETTINGS.sound) T.Sound.play('bid', 1); }
      render();
    },
    'toggle-sound': function () { SETTINGS.sound = !SETTINGS.sound; T.Sound.on = SETTINGS.sound; saveSettings(); if (SETTINGS.sound) T.Sound.play('bid', 1); render(); },
    'start-game': function () {
      var s = UI.setup;
      var names = s.names.map(function (n, i) { return n.trim() || 'Player ' + (i + 1); });
      var lower = names.map(function (n) { return n.toLowerCase(); });
      var dup = lower.filter(function (n, i) { return lower.indexOf(n) !== i; })[0];
      if (dup) { UI.msg = 'Two players are both called “' + names[lower.indexOf(dup)] + '”. Give everyone a different name.'; render(); return; }
      G = T.newGame(s.modeId, names, { rounds: s.rounds, bidStyle: s.bidStyle });
      UI.screen = 'game'; UI.msg = ''; UI.showMode = false;
      save(); T.Sound.play('reveal'); render(); window.scrollTo(0, 0);
    },
    'reveal': function () { T.reveal(G); UI.reveal = true; T.Sound.play('reveal'); save(); render(); },
    'open-bidding': function () {
      T.openBidding(G); UI.msg = ''; T.Sound.play('gavel'); save();
      if (G.bidStyle === 'secret' && G.auction.secret && !G.auction.secret.order.length) { toast('Nobody has money left to bid.'); }
      render();
    },
    'bid': function (el) { doBid(el.dataset.pid, +el.dataset.amt); },
    'bid-custom': function (el) {
      var input = document.getElementById('cb-' + el.dataset.pid);
      var raw = input ? input.value.trim() : '';
      if (!/^\d+$/.test(raw)) { UI.msg = 'Type a whole-dollar amount, like 7.'; T.Sound.play('error'); render(); return; }
      doBid(el.dataset.pid, parseInt(raw, 10));
    },
    'pass': function (el) {
      var why = T.pass(G, el.dataset.pid);
      UI.msg = why; if (!why) T.Sound.play('pass'); else T.Sound.play('error');
      save(); render();
    },
    'undo': function () { var e = T.undo(G); UI.msg = e ? 'Undid ' + T.player(G, e.pid).name + '’s ' + (e.type === 'bid' ? '$' + e.amount + ' bid' : 'pass') + '.' : ''; save(); render(); },
    'sell': function () {
      var before = {};
      G.players.forEach(function (p) { before[p.id] = p.balance; });
      var res = T.closeAuction(G);
      if (!res) return;
      UI.msg = '';
      if (res.result === 'sold') {
        var w = res.winner;
        UI.pop = { pid: w.id, win: w.wins[w.wins.length - 1] };
        UI.overlay = { type: 'sold', pid: w.id, price: res.price, before: before[w.id], round: G.roundIndex };
        T.Sound.play('gavel'); T.Sound.play('sold');
        save(); render();
        confetti([w.color, '#FFE94D', '#00AEEF', '#EC008C']);
        setTimeout(function () { UI.pop = null; }, 1400);
        if (SETTINGS.ai) paint(w.id);
      } else {
        UI.overlay = { type: 'unclaimed' };
        T.Sound.play('sad'); save(); render();
      }
    },
    'skip': function () { T.skip(G); UI.overlay = null; UI.msg = ''; UI.confirm = null; T.Sound.play('pass'); save(); render(); },
    'next': function () { goNext(); },
    'next-from-overlay': function () { UI.overlay = null; goNext(); },
    'close-overlay': function () { UI.overlay = null; UI.msg = ''; render(); },
    'toggle-show': function () { UI.showMode = !UI.showMode; render(); },
    'open-host': function () { UI.drawer = 'host'; UI.confirm = null; render(); },
    'open-player': function (el) { UI.drawer = 'player:' + el.dataset.pid; render(); },
    'close-drawer': function () { UI.drawer = null; UI.confirm = null; UI.editorErr = ''; render(); },
    'tab': function (el) { UI.tab = el.dataset.v; UI.confirm = null; render(); },
    'ask-end': function () { UI.confirm = 'end'; render(); },
    'ask-new': function () { UI.confirm = 'new'; render(); },
    'cancel-confirm': function () { UI.confirm = null; render(); },
    'end-game': function () { finishGame(); },
    'restart-new': function () {
      UI.nextNames = G.players.map(function (p) { return p.name; });
      T.store.del(KEYS.game); G = null;
      UI.drawer = null; UI.confirm = null; UI.screen = 'home'; render(); window.scrollTo(0, 0);
    },
    'ai-paint': function (el) { paint(el.dataset.pid); },
    'secret-open': function () { UI.overlay = { type: 'secret', step: 'cover' }; UI.msg = ''; render(); },
    'secret-cover': function () { UI.overlay = { type: 'secret', step: 'cover' }; render(); },
    'secret-show': function () { UI.overlay = { type: 'secret', step: 'pad', amt: 0 }; UI.msg = ''; render(); },
    'secret-key': function (el) {
      var o = UI.overlay, k = el.dataset.k;
      if (k === 'C') o.amt = 0; else if (k === '⌫') o.amt = Math.floor((o.amt || 0) / 10); else o.amt = Math.min(999, (o.amt || 0) * 10 + (+k));
      UI.msg = ''; T.Sound.play('tick'); render();
    },
    'secret-lock': function () { secretEnter(UI.overlay.amt || 0); },
    'secret-pass': function () { secretEnter(0); },
    'secret-reveal': function () {
      var entries = JSON.parse(JSON.stringify(G.auction.secret.entries));
      var res = T.secretResolve(G);
      UI.overlay = { type: 'secret', step: 'reveal', entries: entries, result: res };
      T.Sound.play('reveal'); save(); render();
    },
    'secret-tie': function () {
      var ids = UI.overlay.result.ids;
      T.startSecret(G, ids);
      UI.overlay = { type: 'secret', step: 'cover' }; save(); render();
    },
    'vote': function (el) {
      var g = UI.galleryIdx != null ? GALLERY[UI.galleryIdx].game : G;
      g.votes = g.votes || {};
      var c = el.dataset.c;
      var allBefore = T.VOTE_CATS.every(function (x) { return g.votes[x[0]]; });
      g.votes[c] = g.votes[c] === el.dataset.pid ? null : el.dataset.pid;
      T.Sound.play('bid', 3);
      if (UI.galleryIdx != null) T.store.set(KEYS.gallery, GALLERY); else { save(); syncGalleryVotes(); }
      var t = tallyVotes(g);
      render();
      if (t.champ && !allBefore) { T.Sound.play('fanfare'); confetti(T.PLAYER_COLORS); }
    },
    'save-png': function (el) {
      var g = UI.galleryIdx != null ? GALLERY[UI.galleryIdx].game : G;
      var p = g.players.filter(function (x) { return x.id === el.dataset.pid; })[0];
      var mode = g.modeObj || T.modeById[g.modeId];
      T.svgToPng(creationSvg(g, p), 2, p.name + '’s ' + mode.name.replace(/^Dream /, 'Dream ')).then(function (blob) {
        return saveBlob((p.name + '-' + mode.name).replace(/[^\w-]+/g, '-').toLowerCase() + '.png', blob);
      }).then(toast, function (err) { toast('Could not save the image: ' + err.message); });
    },
    'play-again': function () {
      var g = UI.galleryIdx != null ? GALLERY[UI.galleryIdx].game : G;
      UI.nextNames = g.players.map(function (p) { return p.name; });
      if (UI.galleryIdx == null) { T.store.del(KEYS.game); G = null; }
      UI.galleryIdx = null; UI.screen = 'home'; render();
      var el = document.getElementById('modes'); if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
    },
    'new-custom': function () {
      UI.editor = { id: null, name: '', blurb: '', cover: '', kind: 'collage', color: '#00AEEF', rounds: 'Bed: 🛏️ Hammock bed (Sway to sleep), 🪺 Giant nest bed\nWay up: 🪜 Rope ladder, 🛗 Tiny elevator, 🧗 Climbing wall\nSnacks: 🍪 Cookie jar on a pulley, 🍿 Popcorn machine\nLookout: 🔭 Telescope, 🏴‍☠️ Pirate crow’s nest\nSecret: 🚪 Trap door, 🗝️ Hidden key vault' };
      UI.editorErr = ''; UI.drawer = 'editor'; render();
    },
    'ed-kind': function (el) { UI.editor.kind = el.dataset.v; render(); },
    'ed-color': function (el) { UI.editor.color = el.dataset.v; render(); },
    'ed-save': function () {
      var r = parseEditor(UI.editor);
      if (r.err) { UI.editorErr = r.err; render(); return; }
      CUSTOM = CUSTOM.filter(function (m) { return m.id !== r.mode.id; });
      CUSTOM.push(r.mode);
      T.store.set(KEYS.custom, CUSTOM);
      T.addModes([r.mode]);
      UI.drawer = null; UI.editor = null; UI.filter = 'custom';
      toast('Saved “' + r.mode.name + '”. Find it under Your Own Modes.');
    },
    'ed-delete': function () {
      var id = UI.editor.id;
      CUSTOM = CUSTOM.filter(function (m) { return m.id !== id; });
      T.store.set(KEYS.custom, CUSTOM);
      if (!(G && G.modeId === id)) T.removeMode(id);
      UI.drawer = null; UI.editor = null; UI.filter = 'all';
      toast('Mode deleted.');
    },
    'edit-custom': function (el) {
      var raw = CUSTOM.filter(function (m) { return m.id === el.dataset.id; })[0];
      if (!raw) return;
      UI.editor = modeToEditor(raw); UI.editorErr = ''; UI.drawer = 'editor'; render();
    }
  };

  function doBid(pid, amount) {
    var why = T.placeBid(G, pid, amount);
    UI.msg = why;
    if (why) T.Sound.play('error');
    else {
      T.Sound.play('bid', amount);
      app.querySelectorAll('.bid-btns input').forEach(function (el) { el.value = ''; });
    }
    save(); render();
  }
  function secretEnter(amount) {
    var why = T.secretEnter(G, amount);
    if (why) { UI.msg = why; T.Sound.play('error'); render(); return; }
    UI.msg = ''; T.Sound.play(amount ? 'bid' : 'pass', amount);
    UI.overlay = { type: 'secret', step: 'locked' };
    save(); render();
  }
  function goNext() {
    if (T.isLastRound(G) || T.everyoneBroke(G)) { finishGame(); return; }
    T.next(G); UI.msg = ''; save(); render();
    var st = document.querySelector('.stage'); if (st && st.getBoundingClientRect().top < 0) st.scrollIntoView({ behavior: 'smooth' });
  }

  /* ---------- boot ---------- */
  var AI_BLOCKED = false;
  var AI_BLOCKED_MSG = 'AI paintings can\u2019t load inside this Claude page. Open the game\u2019s index.html file in a normal browser to use them.';
  T.boot = function (root, restored) {
    app = root;
    // Pages hosted inside the Claude viewer may only load images from their own files, so the AI painter cannot work there.
    AI_BLOCKED = !!(window.claude && window.claude.use);
    if (AI_BLOCKED) SETTINGS.ai = false;
    G = restored && restored.G ? restored.G : loadGame();
    if (restored && restored.UI) Object.assign(UI, restored.UI, { overlay: null, drawer: null });
    else if (G) UI.screen = G.over ? 'results' : 'game';
    app.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      var fn = A[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el); }
    });
    app.addEventListener('input', function (e) {
      var el = e.target;
      if (el.dataset.input === 'pname') UI.setup.names[+el.dataset.i] = el.value;
      if (el.dataset.input === 'ed') UI.editor[el.dataset.k] = el.value;
    });
    app.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.id && e.target.id.indexOf('cb-') === 0) { e.preventDefault(); doBid(e.target.id.slice(3), parseInt(e.target.value, 10)); }
      if (e.key === 'Escape' && (UI.drawer || (UI.overlay && UI.overlay.type !== 'secret'))) { UI.drawer = null; UI.overlay = null; render(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && (UI.drawer || (UI.overlay && UI.overlay.type !== 'secret')) && !app.contains(e.target)) { UI.drawer = null; UI.overlay = null; render(); }
    });
    render();
  };
  T.snapshot = function () { return { G: G, UI: { screen: UI.screen, filter: UI.filter, setup: UI.setup, nextNames: UI.nextNames, galleryIdx: UI.galleryIdx } }; };
})(window.TDA);

(function () {
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return TDA.snapshot(); });
  function start(data) { TDA.boot(document.getElementById('app'), data && data.G !== undefined ? data : null); }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
})();
</script>

</body>
</html>
